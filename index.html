 <!DOCTYPE html>
 <html lang="zh-CN">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>笔记</title>
 <style>
   * { margin: 0; padding: 0; box-sizing: border-box; }
   body {
     font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
     background: #f5f5f5;
     color: #1a1a1a;
     min-height: 100vh;
   }
   .toolbar {
     display: flex; align-items: center; gap: 12px;
     padding: 16px 24px;
     background: #fff;
     border-bottom: 1px solid #e5e5e5;
     position: sticky; top: 0; z-index: 10;
   }
   .toolbar h1 { font-size: 18px; font-weight: 600; }
   .toolbar .actions { margin-left: auto; display: flex; gap: 8px; }
   .btn {
     display: inline-flex; align-items: center; gap: 6px;
     padding: 8px 16px;
     border: 1px solid #d4d4d4;
     border-radius: 6px;
     background: #fff;
     font-size: 14px;
     cursor: pointer;
     transition: background .15s;
   }
   .btn:hover { background: #f0f0f0; }
   .btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
   .btn.primary:hover { background: #333; }
   .container {
     max-width: 720px; margin: 32px auto; padding: 0 24px;
     display: flex; flex-direction: column; gap: 16px;
   }
   .note-card {
     background: #fff;
     border: 1px solid #e5e5e5;
     border-radius: 8px;
     padding: 20px 24px;
     cursor: pointer;
     transition: box-shadow .15s;
     position: relative;
   }
   .note-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
   .note-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
   .note-card p { font-size: 13px; color: #666; line-height: 1.5; }
   .note-card .time { font-size: 12px; color: #999; margin-top: 10px; }
   .note-card .del-btn {
     position: absolute; top: 14px; right: 16px;
     background: none; border: none; color: #999;
     font-size: 18px; cursor: pointer; padding: 4px 8px;
     border-radius: 4px;
   }
   .note-card .del-btn:hover { color: #e00; background: #fef2f2; }
   .editor {
     background: #fff;
     border: 1px solid #e5e5e5;
     border-radius: 8px;
     padding: 20px 24px;
     display: none; flex-direction: column; gap: 12px;
   }
   .editor.active { display: flex; }
   .editor input {
     border: none; outline: none;
     font-size: 18px; font-weight: 600;
     padding: 4px 0;
   }
   .editor textarea {
     border: none; outline: none; resize: vertical;
     font-size: 14px; font-family: inherit;
     line-height: 1.6; min-height: 120px;
   }
   .editor .editor-actions { display: flex; gap: 8px; justify-content: flex-end; }
   .empty-state {
     text-align: center; padding: 60px 0; color: #999;
   }
   .empty-state svg { margin-bottom: 16px; opacity: .3; }
 </style>
 </head>
 <body>
 <div class="toolbar">
   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
   <h1>我的笔记</h1>
   <div class="actions">
     <button class="btn primary" onclick="showEditor()">+ 新建笔记</button>
   </div>
 </div>
 <div class="container" id="notesContainer"></div>
 <div class="editor container" id="editor">
   <input type="text" id="titleInput" placeholder="标题">
   <textarea id="bodyInput" placeholder="写点什么..."></textarea>
   <div class="editor-actions">
     <button class="btn" onclick="hideEditor()">取消</button>
     <button class="btn primary" onclick="saveNote()">保存</button>
   </div>
 </div>
 <script>
 const STORAGE_KEY = 'notes_data';
 let editingId = null;
 
 function loadNotes() {
   try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
   catch { return []; }
 }
 
 function saveNotes(notes) { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
 
 function render() {
   const notes = loadNotes();
   const c = document.getElementById('notesContainer');
   if (notes.length === 0) {
     c.innerHTML = '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg><p>还没有笔记，点击上方按钮开始写</p></div>';
     return;
   }
   c.innerHTML = notes.map((n, i) =>
     '<div class="note-card" onclick="editNote(\'' + n.id + '\')">' +
       '<h3>' + esc(n.title || '无标题') + '</h3>' +
       '<p>' + esc(n.body || '').substring(0, 120) + (n.body && n.body.length > 120 ? '...' : '') + '</p>' +
       '<div class="time">' + n.time + '</div>' +
       '<button class="del-btn" onclick="event.stopPropagation();deleteNote(\'' + n.id + '\')" title="删除">×</button>' +
     '</div>'
   ).join('');
 }
 
 function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
 
 function showEditor(id) {
   editingId = id || null;
   document.getElementById('editor').classList.add('active');
   document.getElementById('notesContainer').style.display = 'none';
   if (id) {
     const n = loadNotes().find(x => x.id === id);
     if (n) {
       document.getElementById('titleInput').value = n.title;
       document.getElementById('bodyInput').value = n.body;
     }
   } else {
     document.getElementById('titleInput').value = '';
     document.getElementById('bodyInput').value = '';
   }
   document.getElementById('titleInput').focus();
 }
 
 function hideEditor() {
   editingId = null;
   document.getElementById('editor').classList.remove('active');
   document.getElementById('notesContainer').style.display = '';
 }
 
 function saveNote() {
   const title = document.getElementById('titleInput').value.trim();
   const body = document.getElementById('bodyInput').value.trim();
   if (!title && !body) return;
   const notes = loadNotes();
   const now = new Date().toLocaleString('zh-CN');
   if (editingId) {
     const idx = notes.findIndex(n => n.id === editingId);
     if (idx !== -1) { notes[idx].title = title; notes[idx].body = body; notes[idx].time = now; }
   } else {
     notes.unshift({ id: Date.now().toString(36), title, body, time: now });
   }
   saveNotes(notes);
   hideEditor();
   render();
 }
 
 function editNote(id) { showEditor(id); }
 
 function deleteNote(id) {
   if (!confirm('确定删除这条笔记？')) return;
   const notes = loadNotes().filter(n => n.id !== id);
   saveNotes(notes);
   render();
 }
 
 render();
 </script>
 </body>
 </html>
